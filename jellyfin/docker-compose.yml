services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    network_mode: host
    restart: "unless-stopped"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /media/ssd4tb/ShowsKids:/data/tvshows_kids:ro
      - /media/ssd4tb/MoviesKids:/data/movies_kids:ro
      - /media/ssd4tb/Shows:/data/tvshows:ro
      - /media/ssd4tb/Movies:/data/movies:ro
